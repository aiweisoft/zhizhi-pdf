<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PDF 工具 · 合并 / 拆分 / 提取文字 | 知智</title>
<meta name="description" content="在线 PDF 工具：合并、拆分、删除页面、调整顺序、旋转，以及扫描件中文 OCR 文字提取。全部在浏览器本地完成，文件不会上传。">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08192B">
<link rel="shortcut icon" href="/img/zhizhi.ico">
<link rel="stylesheet" href="assets/app.css">
</head>

<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/" aria-label="返回知智首页">
      <img src="/img/LOGO-02.png" alt="知智" width="99" height="40">
    </a>
    <nav class="topnav" aria-label="站内导航">
      <a href="/">首页</a>
      <span class="sep" aria-hidden="true">/</span>
      <span aria-current="page">PDF 工具</span>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <h1>PDF 工具</h1>
      <p class="lead">合并、拆分、调页序、旋转、提取文字。全部在你自己的浏览器里算完，<b>文件不会上传</b>。</p>
    </div>
  </section>

  <section class="wrap">
    <!-- 上传区 -->
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="选择或拖入 PDF 文件">
      <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
      </svg>
      <p class="drop-title">拖入 PDF，或点击选择</p>
      <p class="drop-hint">单文件 ≤ 10 MB，最多 20 个文件 / 200 页</p>
      <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar" id="toolbar" hidden>
      <div class="toolbar-info" id="toolbarInfo"></div>
      <div class="toolbar-actions">
        <button type="button" class="btn btn--sm" id="btnSelectAll">全选</button>
        <button type="button" class="btn btn--sm" id="btnInvert">反选</button>
        <button type="button" class="btn btn--sm" id="btnMoveLeft" title="选中页左移一位">← 左移</button>
        <button type="button" class="btn btn--sm" id="btnMoveRight" title="选中页右移一位">右移 →</button>
        <button type="button" class="btn btn--sm" id="btnRotate">旋转 90°</button>
        <button type="button" class="btn btn--sm btn--danger" id="btnDelete">删除</button>
        <button type="button" class="btn btn--sm" id="btnClear">清空</button>
      </div>
    </div>

    <!-- 页面网格 -->
    <div class="pages" id="pages" aria-live="polite"></div>

    <!-- 操作面板 -->
    <div class="actions" id="actions" hidden>
      <div class="tabs" role="tablist">
        <button role="tab" class="tab is-active" data-panel="p-export" aria-selected="true">导出</button>
        <button role="tab" class="tab" data-panel="p-split" aria-selected="false">拆分</button>
        <button role="tab" class="tab" data-panel="p-ocr" aria-selected="false">提取文字</button>
      </div>

      <div class="panel is-active" id="p-export" role="tabpanel">
        <p class="panel-desc">按当前顺序合成一个 PDF。删掉的页不会出现，旋转会保留。</p>
        <button type="button" class="btn btn--primary" id="btnExport">导出 PDF</button>
      </div>

      <div class="panel" id="p-split" role="tabpanel">
        <div class="field">
          <label>拆分方式</label>
          <div class="radios">
            <label class="radio"><input type="radio" name="splitMode" value="range" checked><span>按范围</span></label>
            <label class="radio"><input type="radio" name="splitMode" value="every"><span>每 N 页一个</span></label>
            <label class="radio"><input type="radio" name="splitMode" value="single"><span>每页一个</span></label>
          </div>
        </div>

        <div class="field" id="rangeField">
          <label for="rangeInput">页码范围</label>
          <input type="text" id="rangeInput" placeholder="例如 1-3,5,8-10，每组生成一个文件">
        </div>

        <div class="field" id="everyField" hidden>
          <label for="everyInput">每份页数</label>
          <input type="number" id="everyInput" value="10" min="1" step="1">
        </div>

        <p class="panel-desc" id="splitHint">拆分结果会打包成一个 zip 下载。</p>
        <button type="button" class="btn btn--primary" id="btnSplit">拆分并下载 zip</button>
      </div>

      <div class="panel" id="p-ocr" role="tabpanel">
        <div class="field">
          <label>识别范围</label>
          <input type="text" id="ocrRange" placeholder="留空 = 当前所有页；也可写 1-3,5">
        </div>
        <div class="field">
          <label class="check"><input type="checkbox" id="ocrEng"><span>同时识别英文与数字（首次多下载 3 MB）</span></label>
        </div>
        <p class="panel-desc">
          识别在本地进行。第一次使用需下载识别引擎，约 24 MB，之后会缓存在浏览器里，不会重复下载。
          扫描件越清晰越准；一次建议不超过 20 页。
        </p>
        <div class="btn-row">
          <button type="button" class="btn btn--primary" id="btnOcr">开始识别</button>
          <button type="button" class="btn" id="btnOcrCancel" hidden>停止</button>
        </div>
        <div class="progress" id="ocrProgress" hidden>
          <div class="progress-bar"><i id="ocrBar"></i></div>
          <p class="progress-text" id="ocrStatus"></p>
        </div>
        <div id="ocrResult" hidden>
          <textarea id="ocrText" rows="12" spellcheck="false" aria-label="识别结果"></textarea>
          <div class="btn-row">
            <button type="button" class="btn btn--sm" id="btnCopy">复制全文</button>
            <button type="button" class="btn btn--sm" id="btnDownloadTxt">下载 txt</button>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <p>知智 · 处理全部在本地完成，服务器不保存任何文件。</p>
  </div>
</footer>

<script type="module" src="assets/app.js"></script>
</body>
</html>
